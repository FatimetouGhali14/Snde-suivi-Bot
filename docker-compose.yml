services:
  postgres:
    image: postgres:16
    container_name: snde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: snde_suivi
      POSTGRES_USER: snde
      POSTGRES_PASSWORD: snde
    ports:
      - "5432:5432"
    volumes:
      - snde_pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
volumes:
  snde_pg_data: