[project]
name = "snde-suivi-poc"
version = "0.1.0"
description = "POC plateforme de suivi journalier SNDE via bot Telegram"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[ext]==21.6",
    "asyncpg==0.30.0",
    "openpyxl==3.1.5",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"